<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pago Servicio</title>

<style>

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: black;
}

/* Espacio blanco superior - ahora negro */
.top-space {
  height: 30px;
  background: black;
}

/* Navbar */
.navbar {
  background: black;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(255,255,255,0.05);
}

.back-button {
  font-size: 16px;
  cursor: pointer;
  color: white;
  font-weight: 600;
}

/* Card */
.card {
  background: #1a1a1a;
  padding: 28px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  max-width: 420px;
  margin: 30px auto;
}

.title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 20px;
  color: white;
}

.amount {
  font-size: 36px;
  font-weight: 800;
  color: #1a73e8;
  margin-bottom: 30px;
}

.button {
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  background: #1a73e8;
  color: white;
}

.secondary {
  margin-top: 12px;
  background: #333;
  color: white;
}

.secondary:hover {
  background: #444;
}

/* Overlay */

#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 16px;
  box-sizing: border-box;
  z-index: 9999;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: #1a1a1a;
  padding: 28px;
  border-radius: 20px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  animation: scaleIn 0.25s ease;
}

@keyframes scaleIn {
  from { transform: scale(0.9); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-icon {
  font-size: 40px;
  margin-bottom: 16px;
}

.modal.success .modal-icon {
  color: #16a34a;
}

.modal.error .modal-icon {
  color: #dc2626;
}

.modal h2 {
  margin-bottom: 12px;
  font-size: 20px;
  font-weight: 700;
  color: white;
}

.modal p {
  margin-bottom: 24px;
  font-size: 15px;
  color: #aaa;
  line-height: 1.4;
}

.modal button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  background: #1a73e8;
  color: white;
  cursor: pointer;
}

.modal button:hover {
  background: #1557b0;
}

</style>
</head>

<body>

<div class="top-space"></div>

<div class="navbar">
  <div class="back-button" onclick="goBack()">← Volver</div>
</div>

<div class="card">
  <div class="title">Pago de Servicio</div>
  <div class="amount" id="amountLabel">S/ 0.00</div>

  <button class="button primary" onclick="confirmPayment()">
    Confirmar con Face ID
  </button>

  <button class="button secondary" onclick="testAndroid()">
    Test Android
  </button>
</div>

<script>

/* ============================= */
/* ====== MONTO DINÁMICO ======= */
/* ============================= */

function generateAmount() {
  return (Math.random() * 200 + 20).toFixed(2);
}

let currentAmount = generateAmount();
updateAmountUI();

function updateAmountUI() {
  document.getElementById("amountLabel").innerText = "S/ " + currentAmount;
}

/* ============================= */
/* ====== BRIDGE NATIVO ======== */
/* ============================= */

function postToNative(payload) {
  if (window.webkit?.messageHandlers?.bridge) {
    window.webkit.messageHandlers.bridge.postMessage(
      JSON.stringify(payload)
    );
  }
}

function goBack() {
  postToNative({ event: "goBack" });
}

function confirmPayment() {

  currentAmount = generateAmount();
  updateAmountUI();

  postToNative({
    event: "requestBiometric",
    amount: parseFloat(currentAmount)
  });
}

/* ============================= */
/* ====== TEST ANDROID ========= */
/* ============================= */

function testAndroid() {
  showModal(
    "success",
    "Test Android",
    "Este modal es solo visual. No ejecuta ninguna acción nativa.",
    false
  );
}

/* ============================= */
/* ====== RESPUESTA iOS ======== */
/* ============================= */

function biometricResult(result) {

  console.log("Resultado recibido desde iOS:", result);

  const isSuccess = result === "Autenticado";

  if (isSuccess) {
    showModal(
      "success",
      "Pago exitoso",
      "Tu pago fue procesado correctamente.",
      true
    );
  } else {
    showModal(
      "error",
      "Autenticación fallida",
      "No se pudo validar tu identidad.",
      true
    );
  }
}

/* ============================= */
/* ====== MODAL GLOBAL ========= */
/* ============================= */

function showModal(type, title, message, shouldNotifyNative) {

  const overlay = document.createElement("div");
  overlay.id = "overlay";

  overlay.innerHTML = `
    <div class="modal ${type}">
      <div class="modal-icon">
        ${type === "success" ? "✔︎" : "✖︎"}
      </div>
      <h2>${title}</h2>
      <p>${message}</p>
      <button id="confirmBtn">Aceptar</button>
    </div>
  `;

  document.body.appendChild(overlay);

  document.getElementById("confirmBtn").onclick = function() {
    closeModal(type, shouldNotifyNative);
  };
}

function closeModal(type, shouldNotifyNative) {

  const overlay = document.getElementById("overlay");
  if (overlay) overlay.remove();

  if (shouldNotifyNative) {
    postToNative({
      event: "paymentCompleted",
      status: type,
      amount: parseFloat(currentAmount)
    });
  }
}

</script>

</body>
</html>
