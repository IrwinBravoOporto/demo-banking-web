<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surgir Hybrid Bridge Demo</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #f4f6f8;
    --surface: rgba(255, 255, 255, 0.94);
    --surface-2: #ffffff;
    --line: rgba(20, 32, 48, 0.1);
    --primary: #e40000;
    --primary-dark: #b90000;
    --success: #16a34a;
    --danger: #b42318;
    --warning: #f59e0b;
    --text: #111827;
    --muted: #667085;
    --blue: #0b5cab;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background:
      radial-gradient(circle at 16% 0%, rgba(228, 0, 0, 0.14), transparent 28%),
      linear-gradient(180deg, #ffffff 0%, #f4f6f8 42%, #eef2f6 100%);
    color: var(--text);
  }

  body {
    padding: calc(env(safe-area-inset-top) + 18px) 16px 28px;
  }

  .shell {
    max-width: 520px;
    margin: 0 auto;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0 12px;
  }

  .back-button {
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.86);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
  }

  .badge {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.86);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  }

  .grid {
    display: grid;
    gap: 10px;
  }

  .button {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    border: 0;
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }

  .button.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #ffffff;
    text-align: center;
    font-size: 17px;
  }

  .button.secondary {
    background: #ffffff;
    border: 1px solid var(--line);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
  }

  .button.danger {
    background: #fff4f2;
    border: 1px solid rgba(180, 35, 24, 0.16);
    color: var(--danger);
  }

  .button:active {
    transform: scale(0.99);
  }

  .panel {
    margin-top: 14px;
    padding: 16px;
  }

  .panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .panel-subtitle {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.35;
    margin: -4px 0 12px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--warning);
  }

  .status-dot.ready {
    background: var(--success);
  }

  .kv {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 8px;
    margin-top: 8px;
    font-size: 12px;
  }

  .kv span:first-child {
    color: var(--muted);
    font-weight: 700;
  }

  pre {
    max-height: 260px;
    overflow: auto;
    margin: 0;
    padding: 12px;
    border-radius: 12px;
    background: #0f172a;
    color: #dbeafe;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .log {
    display: grid;
    gap: 8px;
  }

  .log-item {
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #ffffff;
    font-size: 12px;
  }

  .log-item strong {
    display: block;
    margin-bottom: 4px;
  }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.58);
    backdrop-filter: blur(4px);
  }

  .modal {
    width: 100%;
    max-width: 360px;
    padding: 28px;
    border-radius: 20px;
    background: #ffffff;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  }

  .modal-icon {
    font-size: 38px;
    margin-bottom: 14px;
  }

  .modal.success .modal-icon {
    color: var(--success);
  }

  .modal.error .modal-icon {
    color: var(--danger);
  }

  .modal h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }

  .modal p {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }
</style>
</head>

<body>
  <main class="shell">
    <nav class="navbar">
      <div class="back-button" onclick="sendBack()">← Volver</div>
      <div class="badge" id="bridgeStatus">Bridge: waiting</div>
    </nav>

    <section class="panel">
      <div class="panel-title">
        Bridge Tests
        <span class="status-dot" id="readyDot"></span>
      </div>
      <div class="panel-subtitle">
        Prueba capacidades nativas reales desde el WebView.
      </div>

      <div class="grid">
        <button class="button primary" onclick="sendFaceID()">Face ID / Biometría</button>
        <button class="button secondary" onclick="sendContacts()">Contactos</button>
        <button class="button secondary" onclick="sendLocation()">Ubicación</button>
        <button class="button secondary" onclick="sendNotificationPermission()">Notificaciones</button>
        <button class="button secondary" onclick="sendCamera()">Cámara</button>
        <button class="button secondary" onclick="sendFilePicker()">Documentos</button>
        <button class="button secondary" onclick="sendShare()">SHARE</button>
        <button class="button secondary" onclick="sendContext()">Contexto</button>
        <button class="button secondary" onclick="sendTokenRefresh()">Refresh Token Demo</button>
        <button class="button secondary" onclick="sendNativeService()">Native Service</button>
        <button class="button secondary" onclick="sendOpenNativeScreen()">Open Native Screen</button>
        <button class="button danger" onclick="sendClose()">Cerrar demo</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Última respuesta Native → Web</div>
      <div class="kv">
        <span>Evento</span>
        <span id="lastHostEvent">-</span>
        <span>Request ID</span>
        <span id="lastRequestId">-</span>
      </div>
      <pre id="lastHostMessage">{}</pre>
    </section>

    <section class="panel">
      <div class="panel-title">Log del bridge</div>
      <div class="log" id="log"></div>
    </section>
  </main>

<script>
  const BRIDGE_HANDLER = "nativeBridge";
  const FLOW_ID = "hybrid-demo-flow";
  const NAMESPACE = "hybrid-demo";

  let currentAmount = generateAmount();
  let eventCounter = 0;
  let lastContract = null;
  let lastToken = null;

  updateAmountUI();
  installHostBridgeDispatcher();
  window.addEventListener("DOMContentLoaded", () => {
    sendReady();
    sendVisualReady();
  });

  function generateAmount() {
    return (Math.random() * 200 + 20).toFixed(2);
  }

  function updateAmountUI() {
    document.getElementById("amountLabel").innerText = "S/ " + currentAmount;
  }

  function makeEnvelope(event, payload = {}) {
    return {
      event,
      requestId: makeRequestId(),
      flowId: FLOW_ID,
      namespace: NAMESPACE,
      source: "demo-banking-web",
      author: "Irwin Bravo Oporto",
      ...payload
    };
  }

  function makeRequestId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    eventCounter += 1;
    return `web-${Date.now()}-${eventCounter}`;
  }

  function postToNative(message) {
    log("Web → Native", message.event || message.action || "UNKNOWN", message);

    const handler = window.webkit?.messageHandlers?.[BRIDGE_HANDLER];
    if (handler) {
      handler.postMessage(message);
      return;
    }

    log("Bridge unavailable", "nativeBridge handler not found", {
      hint: "Open this page inside the iOS HybridBridgeDemoView."
    });
  }

  function installHostBridgeDispatcher() {
    window.__HOST_BRIDGE_PENDING__ = window.__HOST_BRIDGE_PENDING__ || [];

    window.__HOST_BRIDGE_DISPATCH__ = function(message) {
      handleHostMessage(message);
    };

    while (window.__HOST_BRIDGE_PENDING__.length > 0) {
      handleHostMessage(window.__HOST_BRIDGE_PENDING__.shift());
    }
  }

  function handleHostMessage(message) {
    const event = message?.event || "UNKNOWN";

    document.getElementById("lastHostEvent").innerText = event;
    document.getElementById("lastRequestId").innerText = message?.requestId || "-";
    document.getElementById("lastHostMessage").innerText = JSON.stringify(redact(message), null, 2);

    log("Native → Web", event, redact(message));

    switch (event) {
      case "INIT_WEBVIEW":
      case "RELOAD_CONTEXT":
        lastContract = message.payload || null;
        markReady(true);
        break;
      case "UPDATE_TOKEN":
        lastToken = message.payload?.accessToken || null;
        showModal("success", "Token actualizado", "Native respondió UPDATE_TOKEN con token demo.", false);
        break;
      case "BIOMETRIC_RESULT":
        biometricResult(message.payload?.status === "success" ? "Autenticado" : "Fallido");
        break;
      case "CONTACTS_RESULT":
        showModal("success", "Contactos mock", "Native respondió una lista de contactos de demo.", false);
        break;
      case "LOCATION_RESULT":
        showModal("success", "Ubicación mock", "Native respondió Lima, Perú en modo simulado.", false);
        break;
      case "NOTIFICATION_PERMISSION_RESULT":
        showModal("success", "Permiso simulado", `Estado: ${message.payload?.status || "unknown"}`, false);
        break;
      case "NATIVE_SERVICE_RESULT":
        showModal("success", "Servicio nativo mock", "Native respondió desde native-demo.", false);
        break;
      case "HOST_ERROR":
        showModal("error", "HOST_ERROR", message.payload?.message || "Error recibido desde native.", false);
        break;
      default:
        break;
    }
  }

  function markReady(isReady) {
    document.getElementById("bridgeStatus").innerText = isReady ? "Bridge: ready" : "Bridge: waiting";
    document.getElementById("readyDot").classList.toggle("ready", isReady);
  }

  function redact(value) {
    return JSON.parse(JSON.stringify(value, (key, current) => {
      const lowered = key.toLowerCase();
      if (lowered.includes("token") || lowered.includes("authorization") || lowered.includes("documentnumber")) {
        return "***";
      }
      return current;
    }));
  }

  function log(direction, title, payload) {
    const container = document.getElementById("log");
    const item = document.createElement("div");
    item.className = "log-item";
    item.innerHTML = `
      <strong>${direction}: ${title}</strong>
      <pre>${JSON.stringify(redact(payload), null, 2)}</pre>
    `;
    container.prepend(item);

    while (container.children.length > 8) {
      container.removeChild(container.lastChild);
    }
  }

  function sendReady() {
    postToNative(makeEnvelope("READY"));
  }

  function sendVisualReady() {
    postToNative(makeEnvelope("VISUAL_READY"));
  }

  function sendBack() {
    postToNative(makeEnvelope("BACK"));
  }

  function sendNext() {
    postToNative(makeEnvelope("NEXT", { status: "paymentCompleted", amount: Number(currentAmount) }));
  }

  function sendClose() {
    postToNative(makeEnvelope("CLOSE"));
  }

  function sendContext() {
    postToNative(makeEnvelope("REQUEST_CONTEXT", { reason: "manual-refresh" }));
  }

  function sendTokenRefresh() {
    postToNative(makeEnvelope("REQUEST_TOKEN_REFRESH", { reason: "token-expired-demo" }));
  }

  function sendFaceID() {
    postToNative(makeEnvelope("REQUEST_FACE_ID", { amount: Number(currentAmount), currency: "PEN" }));
  }

  function sendBiometricAuth() {
    postToNative(makeEnvelope("REQUEST_BIOMETRIC_AUTH", { purpose: "authorize-demo-operation" }));
  }

  function sendContacts() {
    postToNative(makeEnvelope("REQUEST_CONTACTS", { simulated: true }));
  }

  function sendLocation() {
    postToNative(makeEnvelope("REQUEST_LOCATION", { mode: "safe-mock" }));
  }

  function sendNotificationPermission() {
    postToNative(makeEnvelope("REQUEST_NOTIFICATION_PERMISSION", { simulated: true }));
  }

  function sendCamera() {
    postToNative(makeEnvelope("REQUEST_CAMERA", { expected: "HOST_ERROR" }));
  }

  function sendFilePicker() {
    postToNative(makeEnvelope("REQUEST_FILE_PICKER", { expected: "HOST_ERROR" }));
  }

  function sendDocument() {
    postToNative(makeEnvelope("REQUEST_DOCUMENT", { expected: "HOST_ERROR" }));
  }

  function sendShare() {
    postToNative(makeEnvelope("SHARE", {
      title: "Surgir Hybrid Demo",
      text: "Mensaje compartido desde el microfrontend demo.",
      url: window.location.href
    }));
  }

  function sendOpenNativeScreen() {
    postToNative(makeEnvelope("OPEN_NATIVE_SCREEN", {
      screen: "DemoNativeScreen",
      presentation: "alert",
      payload: { amount: Number(currentAmount), currency: "PEN" }
    }));
  }

  function sendNativeService() {
    postToNative(makeEnvelope("REQUEST_NATIVE_SERVICE", {
      service: "demo.echo",
      body: { amount: Number(currentAmount), contractReady: Boolean(lastContract) }
    }));
  }

  function sendSystemUI() {
    postToNative(makeEnvelope("SET_SYSTEM_UI", {
      statusBarStyle: "light",
      backgroundColor: "#050505"
    }));
  }

  function confirmPayment() {
    currentAmount = generateAmount();
    updateAmountUI();
    sendFaceID();
  }

  function biometricResult(result) {
    const isSuccess = result === "Autenticado";

    if (isSuccess) {
      showModal("success", "Pago exitoso", "Tu pago fue procesado correctamente en modo demo.", true);
    } else {
      showModal("error", "Autenticación fallida", "No se pudo validar tu identidad en la simulación.", true);
    }
  }

  function showModal(type, title, message, shouldNotifyNative) {
    const existing = document.getElementById("overlay");
    if (existing) existing.remove();

    const overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.innerHTML = `
      <div class="modal ${type}">
        <div class="modal-icon">${type === "success" ? "✔︎" : "✖︎"}</div>
        <h2>${title}</h2>
        <p>${message}</p>
        <button class="button primary" id="confirmBtn">Aceptar</button>
      </div>
    `;

    document.body.appendChild(overlay);
    document.getElementById("confirmBtn").onclick = function() {
      closeModal(type, shouldNotifyNative);
    };
  }

  function closeModal(type, shouldNotifyNative) {
    const overlay = document.getElementById("overlay");
    if (overlay) overlay.remove();

    if (shouldNotifyNative) {
      postToNative(makeEnvelope("NEXT", {
        status: type,
        amount: Number(currentAmount),
        source: "payment-modal"
      }));
    }
  }
</script>
</body>
</html>
